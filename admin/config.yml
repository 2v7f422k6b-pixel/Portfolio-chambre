# Nana Studio content management.
# GitHub authentication requires a separately configured OAuth proxy.
backend:
  name: github
  repo: 2v7f422k6b-pixel/Portfolio-chambre
  branch: main
  base_url: https://nana-studio-auth.2v7f422k6b.workers.dev
  auth_endpoint: auth
media_folder: "assets/uploads"
public_folder: "/Portfolio-chambre/assets/uploads"
locale: fr
publish: true
collections:
  - name: "content"
    label: "Contenus du portfolio"
    files:
      - name: "presentation"
        label: "Présentation"
        file: "content/presentation.json"
        format: json
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Présentation", name: "about", widget: "text" }
          - { label: "Image de présentation", name: "image", widget: "image", required: false }
      - name: "mini_games"
        label: "Mini-jeux"
        file: "content/mini-games.json"
        format: json
        fields:
          - label: "Cartes"
            name: "games"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Identifiant", name: "id", widget: "hidden" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Illustration", name: "image", widget: "image" }
              - { label: "Tags", name: "tags", widget: "list", required: false }
      - name: "media_tags"
        label: "Tags des médias"
        file: "content/media-tags.json"
        format: json
        fields:
          - label: "Médias et projets"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Aperçu du média", name: "image", widget: "image", required: false, hint: "Image pour reconnaître ce média. Tu peux la remplacer." }
              - { label: "Titre du média", name: "title", widget: "string" }
              - { label: "Identifiant ou nom du fichier", name: "id", widget: "string", hint: "Conserve cet identifiant pour que la recherche retrouve le bon média." }
              - { label: "Catégorie", name: "category", widget: "select", options: ["Illustration", "Animation", "Music & Visuals", "Writing & Editorial", "Mini Games", "Other"], required: false }
              - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Un tag par élément. Tu peux en ajouter autant que tu veux." }
      - name: "contact"
        label: "Contact"
        file: "content/contact.json"
        format: json
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Texte", name: "description", widget: "text" }
  - name: "projects"
    label: "Projets"
    label_singular: "Projet"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["Illustration", "Animation", "Music & Visuals", "Writing & Editorial", "Mini Games"] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Lien", name: "url", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Ajoute un mot-clé par ligne, par exemple illustration, musique, personnel." }
