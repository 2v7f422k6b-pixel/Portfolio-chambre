<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Murs d’Alice · Atelier de Nana</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#fff8f5;color:#74263c;font:15px system-ui,sans-serif}header,footer,.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px}header{justify-content:space-between}h1{font-size:18px;margin:0}button,select,.file{font:inherit;color:inherit;border:1px solid #d990a3;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}button:disabled{opacity:.45}button[aria-pressed=true]{background:#ab3055;color:white}button:focus-visible,select:focus-visible{outline:2px solid #8a438a}fieldset{border:0;margin:0;padding:0;display:flex;gap:4px}#viewport{flex:1;min-height:0;overflow:auto;background:#f3e7e5}#sheet{position:relative;margin:auto;overflow:hidden}#scene{position:absolute;left:0;top:0;width:1536px;height:866px;transform-origin:0 0;isolation:isolate}#scene>.layer,#items{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.piece{width:100px;height:100px;position:absolute;top:0;left:0;transform-origin:0 0;background-size:100% 100%}#sheet{touch-action:none;user-select:none;-webkit-user-select:none}#sheet.pan{touch-action:pan-x pan-y}.handle{position:absolute;width:32px;height:32px;margin:-16px;display:grid;place-items:center;cursor:grab}.handle:after{content:'';width:14px;height:14px;border:2px solid #a62752;background:white;border-radius:50%}#outline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#posterThumb{width:28px;height:32px;object-fit:contain;vertical-align:middle}#status{font-size:13px}#hint{margin:0;color:#7a5260}.tools{border-block:1px solid #efcdd6}.file input{display:none}footer{min-height:42px}.preview #handles,.preview #outline{display:none}select{max-width:180px}#posterTools,#starTools{display:inline-flex;align-items:center;gap:5px}[hidden]{display:none!important}@media(max-width:650px){header,.tools,footer{padding:4px;gap:4px}button,select,.file{font-size:13px;padding:6px}h1{font-size:15px}}
</style></head>
<body><header><h1>Les murs d’Alice</h1><span id="status" role="status">Brouillon sur cet appareil</span></header>
<div class="tools"><fieldset aria-label="Outil"><button data-mode="select">Sélection</button><button data-mode="star">★ Étoiles</button><button data-mode="poster">Affiches</button><button data-mode="pan">Main</button></fieldset>
<span id="starTools"><select id="color" aria-label="Couleur des étoiles"></select></span>
<span id="posterTools" hidden><img id="posterThumb" alt=""><select id="posters" aria-label="Choisir une affiche"></select><label class="file">Importer une image<input id="imageFile" type="file" accept="image/*"></label></span>
<button id="smaller" aria-label="Réduire l’élément">Taille −</button><button id="larger" aria-label="Agrandir l’élément">Taille +</button><button id="remove">Supprimer</button><button id="undo">Annuler</button>
<select id="zoom" aria-label="Zoom"><option value="1">Vue entière</option><option value="2">Zoom ×2</option><option value="4">Zoom ×4</option><option value="8">Zoom ×8</option></select><button id="preview">Aperçu</button></div>
<div id="viewport"><div id="sheet"><div id="scene"><img class="layer" src="assets/room-redraw/IMG_7683.png" alt=""><div id="items"></div><img class="layer" src="assets/room-redraw/alice-premier-plan.webp?v=ombre-1" alt=""></div><svg id="outline" aria-hidden="true"><polygon fill="none" stroke="#ad2856" stroke-dasharray="4 3"/></svg><div id="handles"></div></div></div>
<footer><button id="export">Exporter le placement</button><label class="file">Ouvrir un placement<input id="jsonFile" type="file" accept=".json,application/json"></label><p id="hint"></p></footer>
<script src="alice-murs.js?v=1"></script></body></html>
