<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pages — Aperçu privé du portfolio Nana</title>
<style>
:root{--retro-border:#4d526e;--retro-paper:#fffaf6;--retro-bar:#f6d3e3;--retro-ink:#4b405c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 20%,#ffe5f0,transparent 37%),linear-gradient(135deg,#c8dff2,#dcccf0 47%,#ffcfe0);font-family:"Courier New",Courier,monospace;color:#4b405c;padding:30px 20px 45px}
.preview-head{max-width:1160px;margin:0 auto 15px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;font-weight:bold}
.preview-head span:first-child{padding:8px 12px;background:#fff9ffcc;border:1px solid #69718d;box-shadow:3px 3px 0 #69718d3a}
.preview-head span:last-child{color:#5c506e}
#window{max-width:1160px;margin:auto;min-height:720px;background:var(--retro-paper);border:2px solid #4d526e;box-shadow:10px 10px 0 #4b4e6a55}
.window-top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 14px;background:var(--retro-bar);border-bottom:2px solid #4d526e}
#window-title{font-size:14px;font-weight:bold;flex:1}
.traffic{display:flex;gap:7px}
.dot{display:grid;place-items:center;width:28px;height:28px;background:#fffbfd;border:1px solid #4d526e;font-size:18px;font-family:"Courier New",monospace}
.window-content{min-height:700px}
#pages-library a{color:inherit}
@media(max-width:600px){body{padding:10px 8px 25px}.preview-head{font-size:9px}.preview-head span:last-child{display:none}#window{min-height:500px;box-shadow:4px 4px 0 #4b4e6a55}.window-top{height:42px;padding:0 8px}.dot{width:25px;height:25px}}
</style>
<style>/* Pages — retro editorial library. Scoped to #pages-library. */
#window:has(#pages-library){width:min(1130px,calc(100vw - 26px));max-height:min(92dvh,1040px)}
#window:has(#pages-library) .window-content{padding:0!important;overflow:auto}
#pages-library{--pages-ink:#3c3357;--pages-line:#433759;--pages-paper:#fffaf6;--pages-pink:#f9cfe1;--pages-blue:#b5d4e9;--pages-lilac:#dfc9f4;--pages-mint:#bed9ca;position:relative;background:var(--pages-paper);color:var(--pages-ink);font-family:"Courier New",Courier,monospace;line-height:1.45}
#pages-library *{box-sizing:border-box}
#pages-library button,#pages-library input{font:inherit}
#pages-library .pages-masthead{display:flex;align-items:center;justify-content:space-between;padding:9px 28px;background:#f6d5e4;border-bottom:1px solid var(--pages-line);font-size:10px;letter-spacing:.09em;font-weight:700}
#pages-library .pages-edition{display:flex;gap:11px;align-items:center}
#pages-library .pages-edition>span{font-size:17px;line-height:1}

#pages-library .pages-edition-star{font-size:14px}
#pages-library .pages-intro{padding:35px 34px 33px;display:grid;grid-template-columns:1.18fr .82fr;gap:40px;align-items:stretch;border-bottom:1px solid var(--pages-line);background:repeating-linear-gradient(90deg,transparent,transparent 26px,#e9d3e83b 27px),var(--pages-paper)}
#pages-library .pages-intro-copy{display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
#pages-library .pages-kicker{display:inline-block;padding:5px 9px;border:1px solid var(--pages-line);background:#f8dbe7;letter-spacing:.15em;font-weight:700;font-size:10px;box-shadow:3px 3px 0 #8e779a4a}
#pages-library .pages-intro h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,6vw,83px);font-weight:800;line-height:.94;letter-spacing:-.07em;margin:19px 0 17px;color:#382d50}
#pages-library .pages-intro h1 em{font-weight:400;color:#a45d8f}
#pages-library .pages-intro p{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:440px;font-size:14px;line-height:1.65;color:#695f75;margin:0}
#pages-library .pages-intro-count{display:flex;gap:12px;align-items:center;margin-top:23px}
#pages-library .pages-intro-count strong{font-family:Georgia,serif;font-size:57px;line-height:1}
#pages-library .pages-intro-count>span:nth-child(2){font-weight:700;font-size:10px;letter-spacing:.12em;line-height:1.5}
#pages-library .pages-intro-scribble{font-size:36px;color:#e59ebf;margin-left:18px;transform:rotate(-16deg)}
#pages-library .pages-feature{max-width:390px;min-height:248px;width:100%;margin-left:auto;background:#c8c4e5;border:1px solid var(--pages-line);box-shadow:6px 6px 0 #40355660;display:flex;flex-direction:column;padding:13px 16px 10px;transform:rotate(1deg)}
#pages-library .pages-feature-caption,#pages-library .pages-feature-footer{font-size:10px;font-weight:bold;letter-spacing:.1em}
#pages-library .pages-feature-inner{flex:1;display:grid;place-items:center;text-align:center;font-family:Georgia,serif;font-size:clamp(33px,4.5vw,54px);font-weight:900;letter-spacing:-.09em;line-height:.9;text-transform:lowercase;padding:13px 0}
#pages-library .pages-feature-inner i{color:#fff7f7;text-shadow:1px 1px #392c5b}
#pages-library .pages-feature-sun{font-family:"Courier New",monospace;display:inline-block;color:#e9719e;vertical-align:middle;margin-left:7px;font-size:40px;font-style:normal}
#pages-library .pages-feature-footer{text-align:right}
#pages-library .pages-controls{position:sticky;top:0;z-index:3;border-bottom:1px solid var(--pages-line);background:#fff6f9ef;backdrop-filter:blur(14px)}
#pages-library .pages-tabbar{padding:13px 25px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
#pages-library .pages-tab{border:1px solid var(--pages-line);background:#fffdfb;white-space:nowrap;padding:9px 13px;color:var(--pages-ink);cursor:pointer;box-shadow:2px 2px 0 #a799b55c;font-weight:700;font-size:11px;border-radius:0}
#pages-library .pages-tab span{opacity:.65;font-weight:400;margin-left:4px}
#pages-library .pages-tab.selected,#pages-library .pages-tab[aria-pressed="true"]{background:#edbcd5;box-shadow:inset 2px 2px 0 #574a7140;transform:translate(1px,1px)}
#pages-library .pages-tools{padding:0 25px 13px;display:flex;gap:12px;justify-content:space-between;align-items:center}
#pages-library .pages-search{display:flex;align-items:center;gap:7px;min-width:140px;max-width:360px;flex:1;border:1px solid var(--pages-line);padding:7px 10px;background:#fff}
#pages-library .pages-search>span{font-size:22px;line-height:.65}
#pages-library .pages-search input{border:0;outline:0;width:100%;background:transparent;min-width:0;font-size:12px;color:var(--pages-ink)}
#pages-library .pages-search:focus-within{outline:2px solid #b577a9;outline-offset:2px}
#pages-library .pages-view{display:flex;border:1px solid var(--pages-line);background:white}
#pages-library .pages-view button{width:34px;height:29px;background:white;border:0;color:var(--pages-ink);cursor:pointer;font-size:19px}
#pages-library .pages-view button+button{border-left:1px solid var(--pages-line)}
#pages-library .pages-view button[aria-pressed="true"]{background:#e8d0ef}
#pages-library .pages-results{padding:16px 31px 0;display:flex;justify-content:space-between;gap:12px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#82728e}
#pages-library .pages-shelf{padding:25px 31px 36px;border-bottom:1px dashed #bfafbd}
#pages-library .pages-shelf-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:20px}
#pages-library .pages-shelf-index{font-size:11px;font-weight:700;color:#c16a9b}
#pages-library .pages-shelf-heading h2{font-family:Georgia,serif;font-weight:800;font-size:clamp(26px,3vw,36px);letter-spacing:-.045em;margin:2px 0!important;line-height:1.1;color:#3d3653}
#pages-library .pages-shelf-heading p{font-size:11px;color:#8b7a8f;margin:0!important}
#pages-library .pages-shelf-total{font-size:10px;border:1px solid #cab5ca;padding:6px 8px;white-space:nowrap}
#pages-library .pages-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
#pages-library .pages-item{min-width:0;display:flex;flex-direction:column}
#pages-library .pages-cover{height:205px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:13px 15px;text-decoration:none!important;color:#382d50!important;border:1px solid #44375e;box-shadow:4px 4px 0 #b7a8b7aa;transition:transform .16s,box-shadow .16s}
#pages-library .pages-cover:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:6px 8px 0 #b7a8b7aa}
#pages-library .pages-cover-top,#pages-library .pages-cover-bottom{z-index:1;display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.09em;font-weight:800}
#pages-library .pages-cover-center{position:absolute;inset:40px 17px 30px;display:grid;place-items:center;overflow:hidden}
#pages-library .pages-cover-keyword{z-index:1;font-family:Georgia,serif;font-weight:900;font-size:clamp(18px,2vw,29px);line-height:.97;letter-spacing:-.06em;text-transform:uppercase;text-align:center;max-width:100%;overflow-wrap:anywhere}
#pages-library .pages-cover-lines{position:absolute;inset:3px 0;border:2px solid currentColor;opacity:.14;transform:rotate(-8deg)}
#pages-library .pages-cover-lines:after{content:"";position:absolute;inset:12px;border:1px dashed currentColor}
#pages-library .pages-cover-gn{background:linear-gradient(135deg,#e9d6f5,#f8c6db)}
#pages-library .pages-cover-jdj{background:linear-gradient(135deg,#c7dfe3,#faf0da)}
#pages-library .pages-cover-pp{background:linear-gradient(135deg,#dac4f4,#b5badc)}
#pages-library .pages-cover-mouv{background:linear-gradient(135deg,#ffe1a9,#fac1cd)}
#pages-library .pages-item-meta{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#967d91;margin-top:14px}
#pages-library .pages-item h3{font-family:Georgia,serif;font-size:19px;line-height:1.2;letter-spacing:-.025em;margin:7px 0 14px!important;font-weight:700;color:#3d3450;flex:1}
#pages-library .pages-item h3 a{text-decoration:none;color:inherit}
#pages-library .pages-item h3 a:hover{text-decoration:underline;text-decoration-color:#bd78ab}
#pages-library .pages-item-foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10px;color:#81718c;border-top:1px solid #dbcfd9;padding-top:9px}
#pages-library .pages-item-foot a{text-decoration:none;color:#9c5184;font-weight:700;white-space:nowrap}
#pages-library .pages-item-foot a:hover{text-decoration:underline}
#pages-library .pages-grid-list{grid-template-columns:1fr;gap:9px}
#pages-library .pages-grid-list .pages-item{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;grid-template-rows:auto auto;column-gap:16px;align-items:center;border-bottom:1px solid #ded2de;padding:9px 0}
#pages-library .pages-grid-list .pages-cover{height:76px;grid-row:1/3;padding:6px;box-shadow:2px 2px 0 #ad96ae}
#pages-library .pages-grid-list .pages-cover-center{inset:20px 6px 13px}
#pages-library .pages-grid-list .pages-cover-top,#pages-library .pages-grid-list .pages-cover-bottom{font-size:5px}
#pages-library .pages-grid-list .pages-cover-keyword{font-size:10px}
#pages-library .pages-grid-list .pages-item-meta{grid-column:2;margin:0;align-self:end;justify-content:flex-start}
#pages-library .pages-grid-list .pages-item h3{grid-column:2;align-self:start;margin:3px 0!important;font-size:17px}
#pages-library .pages-grid-list .pages-item-foot{grid-column:3;grid-row:1/3;align-self:center;border:0;display:flex;flex-direction:column;align-items:flex-end}
#pages-library .pages-no-results{padding:58px 24px 74px;text-align:center}
#pages-library .pages-no-results>span{display:block;font-size:45px}
#pages-library .pages-no-results h3{font-size:20px;margin:12px 0}
#pages-library .pages-no-results p{font-size:13px;color:#83748a}
#pages-library .pages-footer{padding:20px 28px;background:#f4dee8;display:flex;justify-content:space-between;gap:25px;font-size:10px;font-weight:700;letter-spacing:.04em;border-top:1px solid var(--pages-line)}
#pages-library a:focus-visible,#pages-library button:focus-visible{outline:3px solid #9c5184;outline-offset:3px}
@media (max-width:820px){#pages-library .pages-intro{grid-template-columns:1fr .75fr;gap:20px;padding:29px 22px}#pages-library .pages-feature{min-height:230px}#pages-library .pages-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#pages-library .pages-shelf{padding:24px 22px}#pages-library .pages-masthead,#pages-library .pages-results{padding-left:22px;padding-right:22px}#pages-library .pages-tabbar{padding-left:22px;padding-right:22px}#pages-library .pages-tools{padding-left:22px;padding-right:22px}}
@media (max-width:570px){#pages-library .pages-intro{grid-template-columns:1fr;gap:23px}#pages-library .pages-feature{margin-left:0;max-width:none;min-height:190px}#pages-library .pages-intro h1{font-size:53px}#pages-library .pages-grid{gap:15px}#pages-library .pages-cover{height:155px;padding:8px}#pages-library .pages-cover-top,#pages-library .pages-cover-bottom{font-size:7px}#pages-library .pages-cover-center{inset:24px 9px 18px}#pages-library .pages-cover-keyword{font-size:17px}#pages-library .pages-item-meta{font-size:9px;flex-wrap:wrap}#pages-library .pages-item h3{font-size:16px}#pages-library .pages-item-foot{font-size:9px;flex-wrap:wrap}#pages-library .pages-results>span:last-child{display:none}#pages-library .pages-shelf-heading{align-items:start}#pages-library .pages-shelf-total{margin-top:16px;font-size:8px}#pages-library .pages-footer{display:block}#pages-library .pages-footer span{display:block;margin-bottom:6px}#pages-library .pages-grid-list .pages-item{grid-template-columns:72px minmax(0,1fr)}#pages-library .pages-grid-list .pages-cover{height:65px}#pages-library .pages-grid-list .pages-item-foot{grid-column:2;grid-row:3;align-items:flex-start;padding:0;margin-top:4px}#pages-library .pages-grid-list .pages-cover-keyword{font-size:8px}}
@media (prefers-reduced-motion:reduce){#pages-library .pages-cover{transition:none}}
</style>
</head>
<body>
<div class="preview-head"><span>✦ NANA / PORTFOLIO — PAGES</span><span>PROPOSITION · PAS ENCORE PUBLIÉE</span></div>
<div id="window" class="mac-window">
<div class="window-top"><span id="window-title">Pages</span><span class="traffic" aria-hidden="true"><span class="dot">□</span><span class="dot">−</span><span class="dot">×</span></span></div>
<div id="window-content" class="window-content"></div>
</div>
<script>window.openWindow=(title,content,type)=>{document.querySelector("#window-title").textContent=title;document.querySelector("#window-content").innerHTML=content;};</script>
<script>/* Pages — editorial archive / Nana Portfolio.
 * Original links supplied by the author; La Ppite links use web archives.
 * Cover art is TYPOGRAPHIC PLACEHOLDER until original article thumbnails can be verified.
 * No external libraries or third-party tracking.
 */
(() => {
  'use strict';
  const SOURCES = [
    {id:'gn',name:'Gearnews.fr',short:'GEARNEWS',descriptor:'Music, ideas & creative practice',number:'01'},
    {id:'jdj',name:'Journal du Japon',short:'JOURNAL DU JAPON',descriptor:'Japanese culture, society & history',number:'02'},
    {id:'pp',name:'La Ppite',short:'LA PPITE',descriptor:'Rap, interviews & music criticism',number:'03'},
    {id:'mouv',name:"Mouv'",short:"MOUV'",descriptor:'Rap, music & pop culture',number:'04'}
  ];
  const ARTICLES = [["gn","La musique est-elle un art comme les autres ?","Philosophie & musique","14 oct. 2026","https://www.gearnews.fr/la-musique-est-elle-un-art-comme-les-autres/"],["gn","Musicien·nes : 8 hacks pour gagner des abonné·es passés au crible","Réseaux sociaux","29 juil. 2026","https://www.gearnews.fr/musicien-nes-8-methodes-pour-gagner-des-abonne-es/"],["gn","Faut-il souffrir pour faire de la musique ?","Créativité & bien-être","3 juin 2026","https://www.gearnews.fr/faut-il-souffrir-pour-faire-de-la-musique/"],["gn","Musicien·ne : comment trouver ta direction artistique (DA) ?","Direction artistique","30 avr. 2026","https://www.gearnews.fr/trouver-ta-direction-artistique-da/"],["gn","« Percer sur Insta » pour les musicien·nes… mythe ou réalité ?","Musique & réseaux","23 mars 2026","https://www.gearnews.fr/percer-sur-insta-pour-les-musiciens/"],["jdj","Japon : n’oublions pas les femmes guerrières !","Histoire & société","9 sept. 2016","https://www.journaldujapon.com/2016/09/09/societe-japon-noublions-pas-les-femmes-guerrieres/"],["jdj","Business-women japonaises : évolution ou stagnation ?","Société & travail","26 avr. 2016","https://www.journaldujapon.com/2016/04/26/business-women-japonaises-evolution-ou-stagnation/"],["jdj","Mère, idol, makeinu : choix et périples de la femme japonaise","Dossier · Société","14 févr. 2016","https://www.journaldujapon.com/2016/02/14/dossier-mere-idol-makeinu-choix-et-periples-de-la-femme-japonaise/"],["jdj","Mariage japonais : les femmes dans l’impasse ?","Dossier · Société","14 févr. 2016","https://www.journaldujapon.com/2016/02/14/dossier-mariage-japonais-les-femmes-dans-limpasse/"],["pp","Bekar : rapper plus fort que l’orage","Interview","3 avr. 2023","https://web.archive.org/web/20260115055137/https://www.lappite.fr/bekar-rapper-plus-fort-que-lorage/"],["pp","Rap français et santé mentale : tentative de psychothérapie","Rap & santé mentale","17 oct. 2022","https://web.archive.org/web/20260216195208/https://www.lappite.fr/rap-francais-et-sante-mentale-tentative-de-psychotherapie/"],["pp","« Les Masques » de Joysad : la puissance de la fragilité","Analyse · Société","24 oct. 2022","https://web.archive.org/web/20251117104229/https://www.lappite.fr/les-masques-de-joysad-la-puissance-de-la-fragilite/"],["pp","Le Hip-Hop Symphonique, prestigieuse anomalie de la scène rap","Reportage & musique","29 déc. 2022","https://web.archive.org/web/20251117095411/https://www.lappite.fr/le-hhs-la-prestigieuse-anomalie-de-la-scene-rap/"],["mouv","Pourquoi Atlanta est l’une des meilleures séries (rap)","Rap & séries","24 mars 2022","https://www.radiofrance.fr/mouv/pourquoi-atlanta-est-l-une-des-meilleures-series-rap-7701213"],["mouv","Pourquoi tout le monde aime Laylow ?","Rap français","16 mars 2022","https://www.radiofrance.fr/mouv/pourquoi-tout-le-monde-aime-laylow-2741434"],["mouv","Manga : ces classiques qui ont marqué les années 2000","Manga & pop culture","11 mars 2022","https://www.radiofrance.fr/mouv/manga-ces-classiques-qui-ont-marque-les-annees-2000-1844072"],["mouv","Rap marocain : les rappeurs les plus chauds du moment","Rap international","","https://www.radiofrance.fr/mouv/rap-marocain-les-rappeurs-les-plus-chauds-du-moment-5910542"]];
  let sourceFilter='all';
  let searchQuery='';
  let displayMode='covers';
  const escapeHTML=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const getSource=id=>SOURCES.find(s=>s.id===id);
  const safeURL=url=> /^https:\/\//.test(url) ? url : '#';
  const wordMark=article=> article[1].replace(/[«»?!:…().]/g,' ').split(/\s+/).filter(w=>w.length>3).slice(0,3).join(' / ').toUpperCase();
  const total=ARTICLES.length;
  function itemHTML(article,index){
    const [id,title,topic,date,url]=article;
    const s=getSource(id);
    const archived=id==='pp';
    const number=String(index+1).padStart(2,'0');
    return `<article class="pages-item">
       <a class="pages-cover pages-cover-${id}" href="${escapeHTML(safeURL(url))}" target="_blank" rel="noopener noreferrer" aria-label="Lire : ${escapeHTML(title)} (${escapeHTML(s.name)})">
         <span class="pages-cover-top"><span>${escapeHTML(s.short)}</span><span>№ ${number}</span></span>
         <span class="pages-cover-center" aria-hidden="true"><span class="pages-cover-lines"></span><span class="pages-cover-keyword">${escapeHTML(wordMark(article))}</span></span>
         <span class="pages-cover-bottom"><span>NANA / WRITING</span><span>${archived?'ARCHIVE ↗':'READ ↗'}</span></span>
       </a>
       <div class="pages-item-meta"><span>${escapeHTML(topic)}</span><span>${escapeHTML(date)}</span></div>
       <h3><a href="${escapeHTML(safeURL(url))}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a></h3>
       <div class="pages-item-foot"><span>${escapeHTML(s.name)}</span><a href="${escapeHTML(safeURL(url))}" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir l'article : ${escapeHTML(title)}">${archived?'Lire l’archive ↗':'Lire l’article ↗'}</a></div>
     </article>`;
  }
  function matches(article){
    if(sourceFilter!=='all'&&article[0]!==sourceFilter)return false;
    if(!searchQuery.trim())return true;
    const s=getSource(article[0]);
    const content=normalize([article[1],article[2],article[3],s.name].join(' '));
    return content.includes(normalize(searchQuery.trim()));
  }
  function collectionHTML(s){
    const articles=ARTICLES.map((a,i)=>({a,i})).filter(o=>o.a[0]===s.id&&matches(o.a));
    if(!articles.length)return '';
    return `<section class="pages-shelf" aria-label="${escapeHTML(s.name)}">
       <header class="pages-shelf-heading">
         <div><span class="pages-shelf-index">/ ${s.number}</span><h2>${escapeHTML(s.name)}</h2><p>${escapeHTML(s.descriptor)}</p></div>
         <span class="pages-shelf-total">${articles.length} ARTICLE${articles.length>1?'S':''}</span>
       </header>
       <div class="pages-grid ${displayMode==='list'?'pages-grid-list':''}">${articles.map(o=>itemHTML(o.a,o.i)).join('')}</div>
     </section>`;
  }
  function render(){
    const host=document.getElementById('pages-collections');
    if(!host)return;
    const sections=SOURCES.filter(s=>sourceFilter==='all'||sourceFilter===s.id).map(collectionHTML).join('');
    host.innerHTML=sections||'<div class="pages-no-results"><span>⌕</span><h3>Aucun article trouvé</h3><p>Essaie une autre recherche ou choisis un autre média.</p></div>';
    const count=document.getElementById('pages-result-count');
    if(count)count.textContent=ARTICLES.filter(matches).length+' / '+total+' ARTICLES';
    document.querySelectorAll('#pages-library [data-pages-source]').forEach(button=>{
      const selected=button.dataset.pagesSource===sourceFilter;
      button.setAttribute('aria-pressed',String(selected));
      button.classList.toggle('selected',selected);
    });
    document.querySelectorAll('#pages-library [data-pages-layout]').forEach(button=>{
      button.setAttribute('aria-pressed',String(button.dataset.pagesLayout===displayMode));
    });
  }
  function openEditorialPages(){
    if(typeof window.openWindow!=='function')return;
    sourceFilter='all';searchQuery='';displayMode='covers';
    window.openWindow('Pages — Editorial Library',`
      <div id="pages-library" class="pages-library">
        <div class="pages-masthead">
          <div class="pages-edition"><span>✳</span> NANA / PORTFOLIO <span>✳</span></div>
          <div class="pages-edition-right">VOL. 01 <span class="pages-edition-star">✦</span> WRITING ARCHIVE</div>
        </div>
        <div class="pages-intro">
          <div class="pages-intro-copy">
            <span class="pages-kicker">WORDS, IDEAS & CULTURE</span>
            <h1>Collected <em>Pages.</em></h1>
            <p>A selection of published writing, from music and philosophy to Japanese society and pop culture.</p>
            <div class="pages-intro-count"><strong>17</strong><span>ARTICLES<br>4 PUBLICATIONS</span><span class="pages-intro-scribble" aria-hidden="true">✷</span></div>
          </div>
          <div class="pages-feature" aria-hidden="true">
            <span class="pages-feature-caption">ISSUE 001 — SELECTED WRITING</span>
            <div class="pages-feature-inner"><span>the<br><i>written</i><br>word<span class="pages-feature-sun">✳</span></span></div>
            <span class="pages-feature-footer">NANA STUDIO / MARSEILLE</span>
          </div>
        </div>
        <div class="pages-controls">
          <div class="pages-tabbar" role="group" aria-label="Choisir le média">
            <button type="button" class="pages-tab selected" data-pages-source="all" aria-pressed="true">All <span>17</span></button>
            ${SOURCES.map(s=>`<button type="button" class="pages-tab" data-pages-source="${s.id}" aria-pressed="false">${escapeHTML(s.name)} <span>${ARTICLES.filter(a=>a[0]===s.id).length}</span></button>`).join('')}
          </div>
          <div class="pages-tools">
            <label class="pages-search"><span aria-hidden="true">⌕</span><input id="pages-search" type="search" placeholder="Search the archive" autocomplete="off" aria-label="Search articles"></label>
            <div class="pages-view" role="group" aria-label="Affichage">
              <button type="button" data-pages-layout="covers" aria-label="Afficher les couvertures" aria-pressed="true">▦</button>
              <button type="button" data-pages-layout="list" aria-label="Afficher la liste" aria-pressed="false">☷</button>
            </div>
          </div>
        </div>
        <div class="pages-results"><span id="pages-result-count" aria-live="polite">17 / 17 ARTICLES</span><span>CURATED EDITORIAL ARCHIVE</span></div>
        <div id="pages-collections"></div>
        <footer class="pages-footer"><span>✳ MADE OF WORDS</span><span>Original publications open in a new tab. La Ppite uses preserved web archives.</span></footer>
      </div>`,'pages-library');
    render();
  }
  // app.js defines openPages globally. Override only this app entry, not the main click routing.
  window.openPages=openEditorialPages;
  document.addEventListener('click',event=>{
    const filter=event.target.closest('#pages-library [data-pages-source]');
    if(filter){sourceFilter=filter.dataset.pagesSource;render();return;}
    const layout=event.target.closest('#pages-library [data-pages-layout]');
    if(layout){displayMode=layout.dataset.pagesLayout;render();}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='pages-search'){searchQuery=event.target.value;render();}
  });
})();
</script>
<script>window.openPages();</script>
</body>
</html>
