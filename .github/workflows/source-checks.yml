name: Check portfolio source

on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.mjs'
      - '**.html'
      - '**.css'
      - '**.json'
      - '.github/workflows/source-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts and local resources
        run: node scripts/verify-source.mjs
      - name: Run regression checks
        run: node --test scripts/check-*.mjs
