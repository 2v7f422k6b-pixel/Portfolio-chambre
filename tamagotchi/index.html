<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon Tamagotchi</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:transparent;font-family:'Courier New',monospace;color:#64345f}.app{position:relative;width:min(96vw,670px);aspect-ratio:1312/1199}.shell{width:100%;height:100%;display:block;pointer-events:none}.screen{position:absolute;left:21.8%;top:27.9%;width:53.2%;height:48.3%;border-radius:8px;background:#ffedf6;box-shadow:inset 0 0 0 2px #bd79b4;overflow:hidden;display:flex;flex-direction:column;padding:2.4% 2.8%;gap:7px}.screen:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#a77baf 4px 4px)}.stats{display:flex;gap:6px;justify-content:space-between;font-size:clamp(8px,1.6vw,12px);font-weight:bold;position:relative}.stat{flex:1;min-width:0}.track{height:8px;border:1px solid #9b69a9;background:#fff;border-radius:5px;overflow:hidden;margin-top:3px}.fill{height:100%;background:#ef85b9;transition:width .35s}.stat:nth-child(2) .fill{background:#96a9ed}.stat:nth-child(3) .fill{background:#b88cdd}.scene{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}.character{position:relative;width:35%;aspect-ratio:1/1;max-width:130px;filter:drop-shadow(0 3px 0 #d3a3c9);animation:bob 2.5s ease-in-out infinite}.hair{position:absolute;inset:5% 9% 13%;border-radius:44% 44% 38% 38%;background:#48303c;border:3px solid #302536}.face{position:absolute;inset:25% 19% 24%;background:#f9c5ad;border-radius:38% 38% 45% 45%;border:2px solid #4a3040}.bangs{position:absolute;top:16%;left:17%;width:66%;height:23%;border-radius:55% 55% 30% 30%;background:#48303c}.eyes{position:absolute;top:48%;left:29%;width:42%;display:flex;justify-content:space-between}.eye{width:9px;height:12px;background:#2b2437;border-radius:50%;box-shadow:2px 1px 0 #fff inset}.mouth{position:absolute;top:70%;left:46%;font-size:14px;color:#c45679}.star{position:absolute;top:23%;right:13%;font-size:20px;color:#f79cc7;text-shadow:1px 1px #8d4d8a}.shirt{position:absolute;bottom:0;left:27%;width:46%;height:25%;background:#f08db8;border:2px solid #734f84;border-radius:35% 35% 15% 15%}.cat{position:absolute;bottom:10%;right:11%;font-size:clamp(16px,4vw,30px)}.bubble{position:absolute;right:3%;top:2%;font-size:clamp(15px,3vw,24px);animation:pop .3s}.message{font-size:clamp(9px,1.8vw,13px);text-align:center;position:relative;min-height:2.6em;display:flex;align-items:center;justify-content:center;line-height:1.3}.actions{position:absolute;left:22.2%;top:64.5%;width:52.8%;height:11.3%;display:grid;grid-template-columns:repeat(5,1fr);gap:1%;}.action{border:2px solid #b97ab7;border-radius:8px;background:#fff1f8;color:#713c70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:700 clamp(8px,1.5vw,11px) 'Courier New',monospace;padding:2px}.action span{font-size:clamp(15px,3vw,26px)}.action:hover,.action:focus-visible{background:#ffd3e8;outline:2px solid #e889b9}.close{position:absolute;right:23%;top:17%;width:5%;height:5%;background:transparent;border:0;cursor:pointer}.close:focus-visible{outline:3px solid #7d4cb1}.reset{position:absolute;left:42%;bottom:9%;width:16%;height:8%;border:0;border-radius:50%;background:transparent;cursor:pointer}.reset:focus-visible{outline:3px solid #7d4cb1}.footer{position:absolute;bottom:1%;width:100%;text-align:center;font-size:11px;color:#684568}.hide{display:none}@keyframes bob{50%{transform:translateY(-4px)}}@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}@media(max-width:460px){.screen{gap:2px}.track{height:5px}.eye{width:5px;height:7px}.face{border-width:1px}.hair{border-width:2px}.shirt{border-width:1px}.star{font-size:12px}.mouth{font-size:9px}.actions{top:64.7%}}
</style></head><body><main class="app" aria-label="Jeu Mon Tamagotchi"><img class="shell" src="tamagotchi.png" alt="Tamagotchi rose en forme d'œuf"><section class="screen" aria-live="polite"><div class="stats"><div class="stat">🍜 Faim<div class="track"><div class="fill" id="food"></div></div></div><div class="stat">🌙 Énergie<div class="track"><div class="fill" id="energy"></div></div></div><div class="stat">💗 Joie<div class="track"><div class="fill" id="joy"></div></div></div></div><div class="scene"><div class="bubble" id="bubble">♡</div><div class="character" role="img" aria-label="Mini personnage de face, cheveux bruns et cardigan rose"><div class="hair"></div><div class="face"></div><div class="bangs"></div><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth" id="mouth">ᴗ</div><div class="star">★</div><div class="shirt"></div></div><div class="cat">🐈</div></div><div class="message" id="message">Coucou ! Prends soin de moi ♡</div></section><div class="actions"><button class="action" data-act="feed"><span>🍜</span>Nourrir</button><button class="action" data-act="sleep"><span>🌙</span>Dormir</button><button class="action" data-act="draw"><span>✏️</span>Dessiner</button><button class="action" data-act="music"><span>🎧</span>Musique</button><button class="action" data-act="cuddle"><span>💗</span>Câliner</button></div><button class="close" aria-label="Fermer le jeu" title="Fermer"></button><button class="reset" aria-label="Recommencer le jeu" title="Réinitialiser les jauges"></button></main><script>
const KEY='portfolio-tamagotchi-v1';const clamp=n=>Math.max(0,Math.min(100,n));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||typeof state.time!=='number')state={food:70,energy:75,joy:75,time:Date.now()};const elapsed=Math.min(72,(Date.now()-state.time)/3600000);state.food=clamp(state.food-elapsed*3);state.energy=clamp(state.energy-elapsed*1.5);state.joy=clamp(state.joy-elapsed*2);const messages={feed:['Miam ! Merci pour les ramen 🍜','C’est délicieux ! ♡'],sleep:['Une petite sieste et ça repart… 🌙','Zzz… je récupère !'],draw:['Je me sens inspirée ! ✏️','Une nouvelle illustration !'],music:['Cette musique est trop bien ! 🎧','Je danse dans ma tête ♫'],cuddle:['Merci pour le câlin ♡','Je me sens aimée ! 💗']};const bubbles={feed:'🍜',sleep:'💤',draw:'✨',music:'♫',cuddle:'💗'};function save(){state.time=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function render(){for(const key of ['food','energy','joy'])document.getElementById(key).style.width=clamp(state[key])+'%';document.getElementById('mouth').textContent=Math.min(state.food,state.energy,state.joy)<20?'︵':'ᴗ';save()}document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;switch(a){case'feed':state.food+=24;state.joy+=4;break;case'sleep':state.energy+=30;state.food-=5;break;case'draw':state.joy+=22;state.energy-=12;state.food-=6;break;case'music':state.joy+=16;state.energy-=4;break;case'cuddle':state.joy+=20;state.energy+=3;break}for(const k of ['food','energy','joy'])state[k]=clamp(state[k]);document.getElementById('message').textContent=messages[a][Math.floor(Math.random()*messages[a].length)];document.getElementById('bubble').textContent=bubbles[a];render()}));document.querySelector('.reset').addEventListener('click',()=>{if(confirm('Recommencer avec toutes les jauges remplies ?')){state={food:100,energy:100,joy:100,time:Date.now()};document.getElementById('message').textContent='C’est reparti ! ♡';render()}});document.querySelector('.close').addEventListener('click',()=>{if(window.parent!==window){window.parent.postMessage({type:'close-tamagotchi'},'*')}else{document.querySelector('.screen').classList.toggle('hide');document.querySelector('.actions').classList.toggle('hide')}});render();
</script></body></html>
