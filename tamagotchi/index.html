<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon Tamagotchi</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.device{position:relative;width:100%;max-width:100%;aspect-ratio:1312/1199}.device img{display:block;width:100%;height:100%;user-select:none;pointer-events:none}.hit{position:absolute;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hit:focus-visible{outline:3px solid #4267d1;border-radius:12px}.close{left:70.7%;top:20.5%;width:6.5%;height:6.5%}.actions{position:absolute;left:21.8%;top:65.8%;width:55%;height:13%;display:grid;grid-template-columns:repeat(5,1fr);gap:0}.actions button{border:0;background:transparent;cursor:pointer}.actions button:focus-visible{outline:3px solid #4267d1;border-radius:8px}.stats{position:absolute;left:63.8%;top:39.3%;width:11.8%;height:17.5%;display:flex;flex-direction:column;justify-content:space-around;pointer-events:none}.meter{height:19%;background:linear-gradient(90deg,rgba(244,80,157,.85) var(--fill),rgba(255,255,255,.20) var(--fill));border-radius:5px;mix-blend-mode:multiply}.meter.energy{background:linear-gradient(90deg,rgba(69,144,231,.75) var(--fill),rgba(255,255,255,.2) var(--fill))}.notice{position:absolute;top:55%;left:29%;width:30%;padding:5px 8px;background:#fff5fbf2;border:2px solid #c97db7;border-radius:10px;color:#8a3574;text-align:center;font-size:clamp(9px,2vw,13px);opacity:0;transition:opacity .2s;pointer-events:none}.notice.show{opacity:1}.info{position:absolute;left:29%;top:50%;font-size:clamp(9px,1.6vw,12px);color:#7d346d;pointer-events:none}</style><link rel="stylesheet" href="../heart-theme.css?v=lena-original-1" data-lena-heart-style></head><body><main class="device" aria-label="Mini-jeu Tamagotchi"><img src="tamagotchi.png" alt="Tamagotchi rose en forme d'œuf, avec une petite fille, un chat et cinq activités"><button class="hit close" aria-label="Fermer le Tamagotchi" onclick="closeGame()"></button><div class="stats" aria-label="Jauges"><div class="meter" id="hunger"></div><div class="meter energy" id="energy"></div><div class="meter" id="joy"></div></div><div class="actions"><button aria-label="Nourrir" onclick="act('feed')"></button><button aria-label="Dormir" onclick="act('sleep')"></button><button aria-label="Dessiner" onclick="act('draw')"></button><button aria-label="Musique" onclick="act('music')"></button><button aria-label="Câliner" onclick="act('cuddle')"></button></div><div class="notice" id="notice" aria-live="polite"></div></main><script>
const KEY='portfolio-tamagotchi-v2';const clamp=n=>Math.max(0,Math.min(100,n));let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}s=s&&typeof s==='object'?s:{hunger:70,energy:80,joy:90,last:Date.now()};for(const k of ['hunger','energy','joy'])if(!Number.isFinite(s[k]))s[k]=75;const hours=Math.min(48,Math.max(0,(Date.now()-(s.last||Date.now()))/3600000));s.hunger=clamp(s.hunger-hours*2);s.energy=clamp(s.energy-hours*1);s.joy=clamp(s.joy-hours*1.5);let timeout;function render(){for(const [id,key] of [['hunger','hunger'],['energy','energy'],['joy','joy']])document.getElementById(id).style.setProperty('--fill',clamp(s[key])+'%');s.last=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}function act(type){const a={feed:[22,0,4,'Miam ! 🍜'],sleep:[0,25,2,'Bonne nuit ! 🌙'],draw:[-4,-8,16,'Quel joli dessin ! 🎨'],music:[-3,-6,18,'On danse ! 🎵'],cuddle:[0,2,20,'Câlin ! 💗']}[type];s.hunger=clamp(s.hunger+a[0]);s.energy=clamp(s.energy+a[1]);s.joy=clamp(s.joy+a[2]);render();const el=document.getElementById('notice');el.textContent=a[3];el.classList.add('show');clearTimeout(timeout);timeout=setTimeout(()=>el.classList.remove('show'),1500)}function closeGame(){if(window.parent!==window)window.parent.postMessage({type:'close-tamagotchi'},'*');else history.length>1?history.back():window.close()}render();
</script><script src="../heart-theme.js?v=lena-original-1" defer></script></body></html>
