<!doctype html>
<html lang="fr">
<head>
<script src="../nana-analytics-config.js?v=20261110-stats-1"></script>
<script src="../nana-analytics.js?v=20261110-stats-1"></script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Tamagotchi</title>
<link rel="stylesheet" href="../nana-font.css">
<link rel="stylesheet" href="tamagotchi.css?v=pixel-font-7">
<link rel="stylesheet" href="../lena-drawings.css?v=20261106-original-colors">
<script defer src="../lena-drawings.js?v=20261106-original-colors"></script>
</head>
<body>
<main class="device" aria-label="Mini-jeu Tamagotchi">
<img class="shell" src="IMG_5225.png" alt="Nanagotchi rose dessiné par Léna" draggable="false">

<section class="screen" aria-label="Léna et son chat">
<canvas id="scene" width="128" height="128" role="img" aria-label="Léna, son chat et des étoiles"></canvas>
<div id="mood" role="status" aria-live="polite"></div><div class="stats" aria-label="Jauges">
<label><span data-fr="Faim" data-en="Food">Faim</span><meter id="hunger" min="0" max="100" value="70"></meter></label>
<label><span data-fr="Énergie" data-en="Energy">Énergie</span><meter id="energy" min="0" max="100" value="80"></meter></label>
<label><span data-fr="Joie" data-en="Joy">Joie</span><meter id="joy" min="0" max="100" value="90"></meter></label>
</div>
<div class="actions">
<button data-action="feed" data-fr="Nourrir" data-en="Feed">Nourrir</button>
<button data-action="sleep" data-fr="Dormir" data-en="Sleep">Dormir</button>
<button data-action="draw" data-fr="Dessiner" data-en="Draw">Dessiner</button>
<button data-action="music" data-fr="Musique" data-en="Music">Musique</button>
<button data-action="cuddle" data-fr="Câliner" data-en="Cuddle">Câliner</button>
</div>
<div id="notice" role="status" aria-live="polite"></div>
</section>
<nav class="device-controls" aria-label="Commandes du Nanagotchi">
<button id="previous" data-fr="Activité précédente" data-en="Previous activity" data-label-only aria-label="Activité précédente">←</button>
<button id="confirm" data-fr="Faire cette activité" data-en="Do selected activity" data-label-only aria-label="Faire cette activité">♥</button>
<button id="next" data-fr="Activité suivante" data-en="Next activity" data-label-only aria-label="Activité suivante">→</button>
</nav><button class="hit close" aria-label="Fermer le Tamagotchi" data-fr="Fermer le Tamagotchi" data-en="Close Tamagotchi" data-label-only></button>
</main>
<script src="../nana-progress.js?v=20261110-stats-1"></script>
<script>window.NanaProgress?.visit('jeu/tamagotchi');</script>
<script src="tamagotchi.js?v=20261108-journal-1"></script>
</body></html>
