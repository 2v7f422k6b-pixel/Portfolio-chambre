const projects={ipad:['presentation.mov','Mon animation de présentation','L’iPad est réservé à mon animation de présentation.','Animation à intégrer ici dès que le fichier vidéo sera prêt.'],about:['about_me.txt','About me','Une petite photo sur le mur ouvrira ma présentation personnelle.','Photo et texte à ajouter.'],draw:['sketchbook.exe','Illustrations & carnets','Croquis, recherches, illustrations et bandes dessinées.','Galerie de dessins à ajouter.'],cd:['discography.zip','Pochettes d’albums','Une sélection de mes créations graphiques autour de la musique.','Pochettes à ajouter.'],marshall:['music_projects.exe','Projets musicaux','Community management et direction créative pour des projets musicaux, notamment Expressive E, Gearnews et Tomasz Bura Group.','Études de cas à ajouter.'],textile:['prints.psd','Textile & prints','Motifs, créations textiles, abayas et recherches graphiques.','Visuels des créations à ajouter.'],video:['reels.mp4','Vidéos & animations','Reels, montage vidéo et motion design.','Sélection de vidéos à ajouter.'],posters:['selected_works','Projets sélectionnés','Les affiches de la chambre donnent accès à une sélection de projets artistiques.','Galerie à ajouter.']};
const vp=document.getElementById('viewport'),scene=document.getElementById('scene'),ov=document.getElementById('overlay'),content=document.getElementById('content');const W=1670,H=942;let scale=1,x=0,y=0,minScale=1,maxScale=3.2;const pointers=new Map();let gesture=null,moved=false;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function bounds(){const vw=vp.clientWidth,vh=vp.clientHeight;minScale=Math.max(vw/W,vh/H);maxScale=Math.max(minScale*3,2.4);scale=clamp(scale,minScale,maxScale);let sw=W*scale,sh=H*scale;x=sw<=vw?(vw-sw)/2:clamp(x,vw-sw,0);y=sh<=vh?(vh-sh)/2:clamp(y,vh-sh,0)}function render(){bounds();scene.style.transform=`translate(${x}px,${y}px) scale(${scale})`}function home(){scale=Math.max(vp.clientWidth/W,vp.clientHeight/H);x=(vp.clientWidth-W*scale)/2;y=(vp.clientHeight-H*scale)/2;render()}function zoom(f,cx=vp.clientWidth/2,cy=vp.clientHeight/2){let old=scale;scale=clamp(scale*f,minScale,maxScale);x=cx-(cx-x)*scale/old;y=cy-(cy-y)*scale/old;render()}function snapshot(){let a=[...pointers.values()];if(a.length===1)return{n:1,px:a[0].x,py:a[0].y,x,y};if(a.length>=2){let cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;return{n:2,cx,cy,dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),x,y,scale}}return null}
vp.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.setPointerCapture(e.pointerId);gesture=snapshot();moved=false});vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.hypot(e.clientX-old.x,e.clientY-old.y)>2)moved=true;if(!gesture)return;let a=[...pointers.values()];if(a.length===1&&gesture.n===1){x=gesture.x+a[0].x-gesture.px;y=gesture.y+a[0].y-gesture.py;render()}else if(a.length>=2){if(gesture.n!==2){gesture=snapshot();return}let cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=clamp(gesture.scale*dist/Math.max(1,gesture.dist),minScale,maxScale);x=cx-(gesture.cx-gesture.x)*scale/gesture.scale;y=cy-(gesture.cy-gesture.y)*scale/gesture.scale;render();moved=true}});function end(e){pointers.delete(e.pointerId);gesture=snapshot()}vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);vp.addEventListener('wheel',e=>{e.preventDefault();let r=vp.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
function openProject(key){let p=projects[key];if(!p)return;document.getElementById('windowTitle').textContent=p[0];content.replaceChildren();let h=document.createElement('h2'),para=document.createElement('p'),ph=document.createElement('div');h.textContent=p[1];para.textContent=p[2];ph.className='placeholder';ph.textContent=p[3];content.append(h,para,ph);ov.classList.add('show');document.getElementById('menu').classList.remove('open')}document.querySelectorAll('.spot').forEach(el=>{let start;el.addEventListener('pointerdown',e=>start={x:e.clientX,y:e.clientY});el.addEventListener('click',e=>{if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>8)return;if(moved)return;openProject(el.dataset.key)})});let nav=document.getElementById('nav');Object.entries(projects).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v[1];b.onclick=()=>openProject(k);nav.append(b)});document.getElementById('menuBtn').onclick=()=>{let m=document.getElementById('menu');m.classList.toggle('open');document.getElementById('menuBtn').setAttribute('aria-expanded',m.classList.contains('open'))};document.getElementById('close').onclick=()=>ov.classList.remove('show');ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')ov.classList.remove('show')});document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('home').onclick=home;window.addEventListener('resize',home);home();
