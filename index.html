#hotspots{position:absolute;inset:0;width:1536px;height:866px;z-index:5;overflow:visible;pointer-events:none}

#hotspots polygon:focus-visible,#hotspots polygon.selected{stroke:white;filter:drop-shadow(0 0 5px white);fill:rgba(255,255,255,.04)}

button{font:inherit} .actions button,.win button,.nav button{background:#fff;border:1px solid #8b6e9d;box-shadow:2px 2px #b0a0b7;padding:7px 9px;color:#442d55;cursor:pointer}
#hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;padding:8px 13px;background:#fff7f0e8;border:1px solid #b57ca2;font-size:12px;text-align:center;pointer-events:none;max-width:90vw}

.win{background:#f9eef5;border:2px solid #fafaff;outline:2px solid #654d88;box-shadow:7px 7px 0 #281f4d;max-width:560px;width:100%;max-height:85dvh;overflow:auto}
.winbar{background:linear-gradient(90deg,#70558f,#d587b1);color:white;padding:8px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;gap:10px}.winmain{padding:22px;line-height:1.55}.winmain h2{margin:0 0 12px;font-size:22px}.winmain p{margin:0 0 12px}.placeholder{border:2px dashed #d9aac4;padding:20px;text-align:center;background:#fff8fa;margin:12px 0}.nav{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.small{font-size:12px;color:#755f7a}

<script>
const items={
ipad:{name:"Présentation animée",file:"hello.mov",html:"<p>L’iPad est réservé à mon animation de présentation.</p><div class='placeholder'>▶ Animation à intégrer ici</div><p class='small'>Le lecteur vidéo sera ajouté quand le fichier sera disponible.</p>"},
about:{name:"About me",file:"about_me.txt",html:"<p>Bienvenue dans ma chambre ! Je travaille entre illustration, création de contenus, vidéo et projets musicaux.</p><div class='placeholder'>Photo personnelle à ajouter ici</div><p>Ce petit espace accueillera ma présentation, mon parcours et mes contacts.</p>"},
illustration:{name:"Illustrations & carnets",file:"sketchbook.exe",html:"<p>Dessins, recherches, personnages, bandes dessinées et carnets de croquis.</p><div class='placeholder'>Galerie à compléter</div>"},
covers:{name:"Pochettes & musique",file:"discography.exe",html:"<p>Pochettes d’albums et créations graphiques liées à la musique.</p><div class='placeholder'>Pochettes à ajouter</div>"},
social:{name:"Projets musicaux & social media",file:"social.exe",html:"<p>Expressive E, Gearnews et projets d’artistes : stratégie, contenus et direction créative.</p><div class='placeholder'>Études de cas à ajouter</div>"},
textile:{name:"Textile & prints",file:"textile.exe",html:"<p>Motifs, imprimés, abayas et recherches textiles.</p><div class='placeholder'>Portfolio textile à ajouter</div>"},
videos:{name:"Vidéos & animations",file:"videos.exe",html:"<p>Reels, montages, animations et formats créatifs.</p><div class='placeholder'>Vidéos à ajouter</div>"},
posters:{name:"Affiches & projets",file:"posters.exe",html:"<p>Les espaces blancs de la chambre sont prévus pour mes propres illustrations et affiches.</p><div class='placeholder'>Affiches à ajouter</div>"},
cv:{name:"CV & contact",file:"contact.txt",html:"<p>Mon CV et mes coordonnées seront accessibles ici.</p><div class='placeholder'>CV / contact à compléter</div>"}
};
for(let i=1;i<=18;i++)items['poster'+i]={name:'Poster '+i+' · Galerie',file:'galerie_'+i+'.exe',html:"<p>Ce poster ouvrira une série d’illustrations à feuilleter.</p><div class='placeholder'>Galerie à compléter</div>"};
items.phone={name:'Smartphone',file:'phone.exe',html:"<p>Une interface de smartphone accueillera tes contenus.</p><div class='placeholder'>À personnaliser</div>"};
items.tamagotchi={name:'Tamagotchi',file:'tamagotchi.exe',html:"<p>Emplacement réservé au mini-jeu Tamagotchi interactif.</p><div class='placeholder'>Mini-jeu à développer</div>"};
for(let i=1;i<=5;i++)items['books'+i]={name:'Livres · Bibliothèque '+i,file:'livres.exe',html:"<p>Livres et projets à feuilleter.</p><div class='placeholder'>À compléter</div>"};
const view=document.getElementById('view'),scene=document.getElementById('scene'),overlay=document.getElementById('overlay');
const W=1536,H=866;let scale=1,x=0,y=0,minScale=1;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function bounds(){const w=view.clientWidth,h=view.clientHeight;minScale=Math.max(w/W,h/H);scale=Math.max(scale,minScale);const sw=W*scale,sh=H*scale;x=sw<=w?(w-sw)/2:clamp(x,w-sw,0);y=sh<=h?(h-sh)/2:clamp(y,h-sh,0)}
function draw(){bounds();scene.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function reset(){scale=Math.max(view.clientWidth/W,view.clientHeight/H);x=(view.clientWidth-W*scale)/2;y=(view.clientHeight-H*scale)/2;draw()}
function zoom(f,cx=view.clientWidth/2,cy=view.clientHeight/2){let old=scale;scale=clamp(scale*f,minScale,Math.max(minScale*4,2));x=cx-(cx-x)*(scale/old);y=cy-(cy-y)*(scale/old);draw()}
const active=new Map();let startDistance=0,startScale=1,startMid=null,moved=false,downTarget=null;
view.addEventListener('pointerdown',e=>{if(e.button!==0)return;active.set(e.pointerId,{x:e.clientX,y:e.clientY});view.setPointerCapture(e.pointerId);downTarget=e.target.closest('[data-item]');moved=false;if(active.size===2){const a=[...active.values()];startDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startScale=scale;startMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};moved=true}view.classList.add('drag')});
view.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;const prev=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===1){let dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;x+=dx;y+=dy;draw()}else if(active.size===2){const a=[...active.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const target=clamp(startScale*dist/Math.max(1,startDistance),minScale,Math.max(minScale*4,2));const ratio=target/scale;x=mid.x-(mid.x-x)*ratio;y=mid.y-(mid.y-y)*ratio;scale=target;draw();moved=true}});
view.addEventListener('pointerup',e=>{const was=active.size;active.delete(e.pointerId);view.classList.remove('drag');if(was===1&&!moved&&downTarget){const obj=downTarget;const touch=e.pointerType==='touch';const selected=obj.classList.contains('selected');document.querySelectorAll('#hotspots .selected').forEach(p=>p.classList.remove('selected'));if(touch&&!selected)obj.classList.add('selected');else openItem(obj.dataset.item);}if(active.size===1){const p=[...active.values()][0];startMid=p}downTarget=null});
view.addEventListener('pointercancel',e=>active.delete(e.pointerId));
view.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
function openItem(key){let item=items[key];if(!item)return;document.getElementById('filename').textContent=item.file;document.getElementById('wtitle').textContent=item.name;document.getElementById('content').innerHTML=item.html;overlay.classList.add('open')}
document.querySelectorAll('#hotspots [data-item]').forEach(el=>{el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openItem(el.dataset.item)}})});
document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open')});
document.getElementById('toggle').onclick=()=>{document.body.classList.toggle('night');document.getElementById('toggle').textContent=document.body.classList.contains('night')?'☀ Jour':'☾ Nuit'};
document.getElementById('plus').onclick=()=>zoom(1.3);document.getElementById('minus').onclick=()=>zoom(1/1.3);document.getElementById('reset').onclick=reset;
document.getElementById('menu').onclick=()=>{document.getElementById('filename').textContent='explorer.exe';document.getElementById('wtitle').textContent='Explorer la chambre';document.getElementById('content').innerHTML='<p>Choisissez une rubrique :</p><div class="nav">'+Object.entries(items).map(([key,v])=>'<button data-open="'+key+'">'+v.name+'</button>').join('')+'</div>';overlay.classList.add('open');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.dataset.open))};
window.addEventListener('resize',draw);reset();
</script></body></html>
