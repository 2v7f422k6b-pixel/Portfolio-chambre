.iphone-app-layer[hidden]{display:none}
.ios-header{height:53px;display:flex;align-items:center;justify-content:space-between;padding:16px 10px 0;background:#f7e9f4;border-bottom:1px solid #e9d5e5;gap:5px}
.ios-header button{background:none;border:0;color:#7751b2;font:inherit;cursor:pointer;padding:8px 2px}
.ios-header strong{font-size:13px;white-space:nowrap}
.ios-contacts{padding:15px;overflow:auto;height:calc(100% - 53px)}

.ios-contacts h2{text-align:center;font-size:17px;margin:10px 0 22px}
.ios-card{background:white;border-radius:12px;padding:12px;margin:9px 0;display:flex;flex-direction:column;gap:5px;overflow-wrap:anywhere}
.ios-card small{color:#8c7b94}.ios-card a{color:#6251b1}

.ios-mail{height:100%;display:flex;flex-direction:column}
.ios-mail .ios-header{flex:none}
.ios-send{font-size:22px!important;font-weight:800!important}

.ios-mail-scroll{flex:1;overflow:auto;background:#fff;padding:0 12px;min-height:0}
.ios-mail-scroll label{display:flex;align-items:center;border-bottom:1px solid #eee7f1;padding:11px 0;gap:7px;color:#827a87;font-size:12px}
.ios-mail-scroll input{border:0;outline:0;background:none;flex:1;min-width:0;font:inherit;font-size:12px;color:#29242e}
.ios-recipient{color:#333;overflow-wrap:anywhere;font-size:11px}
.ios-mail-scroll textarea{display:block;width:100%;min-height:130px;border:0;resize:none;outline:0;padding:13px 0;font:inherit;font-size:13px;box-sizing:border-box}
.ios-mail-status{font-size:12px;min-height:20px;color:#756b83}.ios-mail-status.success{color:#24744b}.ios-mail-status.error{color:#a32d55}
.ios-keyboard{display:none;background:#d9dce4;padding:8px 3px 17px;flex:none;user-select:none;touch-action:manipulation}
.ios-keyboard.visible{display:block}
.ios-keyrow{display:flex;justify-content:center;gap:3px;margin:4px 0}
.ios-keyrow button{flex:1;min-width:0;border:0;background:white;border-radius:5px;height:27px;font-size:11px;color:#252532;box-shadow:0 1px 1px #a3a4ae}
.ios-keyrow:last-child button:nth-child(2){flex:5}

const phoneHTML=`<div class="phone-wrap"><div class="iphone-device" aria-label="iPhone interactif">
 <button type="button" class="iphone-exit" aria-label="Fermer le téléphone" onclick="document.getElementById('overlay').classList.remove('open','phone-mode')">×</button><div class="iphone-screen">

const view=document.getElementById('view'),scene=document.getElementById('scene'),overlay=document.getElementById('overlay');
const W=1536,H=866;let scale=1,x=0,y=0,minScale=1;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function bounds(){const w=view.clientWidth,h=view.clientHeight;minScale=Math.max(w/W,h/H);scale=Math.max(scale,minScale);const sw=W*scale,sh=H*scale;x=sw<=w?(w-sw)/2:clamp(x,w-sw,0);y=sh<=h?(h-sh)/2:clamp(y,h-sh,0)}
function draw(){bounds();scene.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function reset(){scale=Math.max(view.clientWidth/W,view.clientHeight/H);x=(view.clientWidth-W*scale)/2;y=(view.clientHeight-H*scale)/2;draw()}
function zoom(f,cx=view.clientWidth/2,cy=view.clientHeight/2){let old=scale;scale=clamp(scale*f,minScale,Math.max(minScale*4,2));x=cx-(cx-x)*(scale/old);y=cy-(cy-y)*(scale/old);draw()}
const active=new Map();let startDistance=0,startScale=1,startMid=null,moved=false,downTarget=null;
view.addEventListener('pointerdown',e=>{if(e.button!==0)return;active.set(e.pointerId,{x:e.clientX,y:e.clientY});view.setPointerCapture(e.pointerId);downTarget=e.target.closest('[data-item]');moved=false;if(active.size===2){const a=[...active.values()];startDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startScale=scale;startMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};moved=true}view.classList.add('drag')});
view.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;const prev=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===1){let dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;x+=dx;y+=dy;draw()}else if(active.size===2){const a=[...active.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const target=clamp(startScale*dist/Math.max(1,startDistance),minScale,Math.max(minScale*4,2));const ratio=target/scale;x=mid.x-(mid.x-x)*ratio;y=mid.y-(mid.y-y)*ratio;scale=target;draw();moved=true}});
view.addEventListener('pointerup',e=>{const was=active.size;active.delete(e.pointerId);view.classList.remove('drag');if(was===1&&!moved&&downTarget){const obj=downTarget;const touch=e.pointerType==='touch';const selected=obj.classList.contains('selected');document.querySelectorAll('#hotspots .selected').forEach(p=>p.classList.remove('selected'));if(touch&&!selected)obj.classList.add('selected');else openItem(obj.dataset.item);}if(active.size===1){const p=[...active.values()][0];startMid=p}downTarget=null});
view.addEventListener('pointercancel',e=>active.delete(e.pointerId));
view.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
function openItem(key){let item=items[key];if(!item)return;overlay.classList.toggle('egg-mode',key==='tamagotchi');overlay.classList.toggle('phone-mode',key==='phone');document.getElementById('filename').textContent=item.file;document.getElementById('wtitle').textContent=item.name;document.getElementById('content').innerHTML=key==='tamagotchi'?'<iframe src="tamagotchi/index.html?v=3" title="Jeu Tamagotchi interactif" allow="autoplay"></iframe>':item.html;overlay.classList.add('open')}
document.querySelectorAll('#hotspots [data-item]').forEach(el=>{el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openItem(el.dataset.item)}})});
document.getElementById('close').onclick=()=>overlay.classList.remove('open','phone-mode');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open','phone-mode')});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('open','phone-mode')});

document.getElementById('menu').onclick=()=>{overlay.classList.remove('phone-mode');document.getElementById('filename').textContent='explorer.exe';document.getElementById('wtitle').textContent='Explorer la chambre';document.getElementById('content').innerHTML='<p>Choisissez une rubrique :</p><div class="nav">'+Object.entries(items).map(([key,v])=>'<button data-open="'+key+'">'+v.name+'</button>').join('')+'</div>';overlay.classList.add('open');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.dataset.open))};
document.querySelectorAll('[data-shortcut]').forEach(b=>b.addEventListener('click',()=>openItem(b.dataset.shortcut)));

function updatePlayer(){document.getElementById('playpause').textContent=song.paused?'▶':'❚❚';document.getElementById('playerstate').textContent=song.paused?'En pause':'Lecture en cours';document.querySelector('[data-app="music"]').classList.toggle('playing',!song.paused)}
document.getElementById('playpause').onclick=()=>{if(song.paused){song.play().catch(()=>{document.getElementById('playerstate').textContent='Appuie sur Lecture';});}else song.pause()};
document.getElementById('closeplayer').onclick=()=>{player.classList.remove('open');song.pause()};
song.addEventListener('play',updatePlayer);song.addEventListener('pause',updatePlayer);
function fmt(sec){sec=Math.floor(sec||0);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
song.addEventListener('loadedmetadata',()=>document.getElementById('duration').textContent=fmt(song.duration));
song.addEventListener('timeupdate',()=>{document.getElementById('elapsed').textContent=fmt(song.currentTime);if(song.duration)document.getElementById('seek').value=100*song.currentTime/song.duration});
document.getElementById('seek').oninput=e=>{if(song.duration)song.currentTime=song.duration*e.target.value/100};
song.volume=.65;document.getElementById('volume').oninput=e=>song.volume=e.target.value/100;

const FORMSPREE_FORM_ID='mbggaaqo';

</form>`};
// Gestion d'envoi déléguée pour rester active après ouverture de la fenêtre.
document.addEventListener('submit',async function(event){
  if(event.target.id!=='portfolio-mail-form')return;
  event.preventDefault();
  const form=event.target,button=form.querySelector('[type="submit"]'),status=form.querySelector('#mail-status');
  status.className='mail-status';
  if(!FORMSPREE_FORM_ID){status.textContent='Envoi non activé : configurez d’abord votre identifiant Formspree.';status.classList.add('error');return;}
  button.disabled=true;button.textContent='Envoi en cours…';status.textContent='';
  try{
    const response=await fetch('https://formspree.io/f/'+encodeURIComponent(FORMSPREE_FORM_ID),{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('Formspree : '+response.status);
    form.reset();status.textContent='Message envoyé ! Merci, je vous répondrai dès que possible.';status.classList.add('ok');
  }catch(err){status.textContent='Le message n’a pas pu être envoyé. Veuillez réessayer.';status.classList.add('error');}
  finally{button.disabled=false;button.textContent='✉ Envoyer';}
});

// iPhone Miffy : écran et composition Mail intégrés, envoi Formspree.
const iphoneLayer=()=>document.getElementById('iphone-app-layer');
const iphoneHome=()=>{const layer=iphoneLayer();if(layer){layer.hidden=true;layer.innerHTML='';}};
function iphoneContacts(){
 const layer=iphoneLayer();if(!layer)return;layer.hidden=false;
 layer.innerHTML=`<div class="ios-header"><button type="button" data-iphone-home>‹ Retour</button><strong>Contacts</strong><span></span></div>
 <div class="ios-contacts"><div class="ios-avatar">L</div><h2>Léna de Firmas</h2>
 <div class="ios-card"><small>téléphone</small><a href="tel:+33609630543">06 09 63 05 43</a></div>
 <div class="ios-card"><small>e-mail</small><span>lena.defirmas@gmail.com</span></div>
 <div class="ios-card"><small>Instagram</small><a href="https://www.instagram.com/nanacolorstudio/" target="_blank" rel="noopener noreferrer">@nanacolorstudio</a></div>
 <button type="button" class="ios-compose-link" data-iphone-compose>✉ Écrire un e-mail</button></div>`;
}
function iphoneCompose(){
 const layer=iphoneLayer();if(!layer)return;layer.hidden=false;
 layer.innerHTML=`<form id="iphone-mail-form" class="ios-mail">
 <div class="ios-header"><button type="button" data-iphone-home>Annuler</button><strong>Nouveau message</strong><button type="submit" class="ios-send">↑</button></div>
 <div class="ios-mail-scroll">
 <label>De : <input type="email" name="email" placeholder="Votre adresse e-mail" autocomplete="email" required maxlength="254"></label>
 <label>Nom : <input name="name" placeholder="Votre nom" autocomplete="name" required maxlength="120"></label>
 <label>À : <span class="ios-recipient">lena.defirmas@gmail.com</span></label>
 <label>Objet : <input name="subject" placeholder="Objet" required maxlength="180"></label>
 <textarea name="message" placeholder="Votre message…" aria-label="Votre message" required maxlength="10000"></textarea>
 <p class="ios-mail-status" role="status" aria-live="polite"></p></div>
 <div class="ios-keyboard" aria-label="Clavier virtuel"></div></form>`;
 const kb=layer.querySelector('.ios-keyboard');
 ['qwertyuiop','asdfghjkl','⇧zxcvbnm⌫'].forEach(row=>{
  const line=document.createElement('div');line.className='ios-keyrow';
  for(const key of row){const b=document.createElement('button');b.type='button';b.textContent=key;b.dataset.iosKey=key;line.append(b);}
  kb.append(line);
 });
 const line=document.createElement('div');line.className='ios-keyrow';
 for(const [text,value] of [['123','123'],['espace',' '],['.','.'],['↵','\\n']]){const b=document.createElement('button');b.type='button';b.textContent=text;b.dataset.iosKey=value;line.append(b);}kb.append(line);
}
let iphoneActiveInput=null;
document.addEventListener('focusin',e=>{
 if(e.target.closest('#iphone-mail-form') && e.target.matches('input,textarea')){
  iphoneActiveInput=e.target;
  const kb=document.querySelector('#iphone-mail-form .ios-keyboard');
  if(kb)kb.classList.add('visible');
 }
});
document.addEventListener('click',e=>{
 const app=e.target.closest('[data-phone-app]');
 if(app){if(app.dataset.phoneApp==='contacts')iphoneContacts();
 else if(app.dataset.phoneApp==='mail')iphoneCompose();
 else if(app.dataset.phoneApp==='instagram')window.open('https://www.instagram.com/nanacolorstudio/','_blank','noopener,noreferrer');
 return;}
 if(e.target.closest('[data-iphone-home]')){iphoneHome();return;}
 if(e.target.closest('[data-iphone-compose]')){iphoneCompose();return;}
 const key=e.target.closest('[data-ios-key]');
 if(key && iphoneActiveInput){
  e.preventDefault();const input=iphoneActiveInput,k=key.dataset.iosKey;
  const a=input.selectionStart??input.value.length,b=input.selectionEnd??input.value.length;
  if(k==='⌫'){const from=a===b?Math.max(0,a-1):a;input.setRangeText('',from,b,'end');}
  else if(k==='⇧'||k==='123')return;
  else input.setRangeText(k,a,b,'end');
  input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();
 }
});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='iphone-mail-form')return;
 e.preventDefault();const form=e.target,button=form.querySelector('.ios-send'),status=form.querySelector('.ios-mail-status');
 if(!form.reportValidity())return;
 button.disabled=true;status.textContent='Envoi en cours…';
 try{
  const response=await fetch('https://formspree.io/f/mbggaaqo',{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});
  if(!response.ok)throw new Error('Envoi impossible ('+response.status+')');
  status.textContent='✓ Message envoyé !';status.className='ios-mail-status success';
  form.querySelectorAll('input,textarea').forEach(el=>el.disabled=true);
  const kb=form.querySelector('.ios-keyboard');if(kb)kb.classList.remove('visible');
 }catch(err){status.textContent='Échec de l’envoi. Réessayez.';status.className='ios-mail-status error';}
 finally{button.disabled=false;}
});
</script></body></html>
