 outline:none !important; box-shadow:none !important;

  <script id="touch-hotspots-script">
  (() => {
    const scene = document.getElementById('play-scene');
    const svg = document.getElementById('hotspots');
    const viewport = document.getElementById('play-viewport');
    if (!scene || !svg || !viewport) return;

    const guide = document.createElement('button');
    guide.type = 'button';
    guide.id = 'hotspot-guide';
    guide.textContent = '✧ Voir les zones';
    guide.setAttribute('aria-label', 'Afficher les contours des éléments cliquables');
    guide.setAttribute('aria-pressed', 'false');
    viewport.appendChild(guide);

    let releaseTimer;
    let touching = false;
    const isTouch = event => event.pointerType === 'touch' || event.pointerType === 'pen';

    function mark(target) {
      svg.querySelectorAll('polygon.touch-target').forEach(p => p.classList.remove('touch-target'));
      const polygon = target && target.closest && target.closest('polygon');
      if (polygon && svg.contains(polygon)) polygon.classList.add('touch-target');
    }
    function clearPeek() {
      if (guide.getAttribute('aria-pressed') !== 'true') svg.classList.remove('hotspot-peek');
      mark(null);
    }
    function release() {
      if (!touching) return;
      touching = false;
      clearTimeout(releaseTimer);
      releaseTimer = setTimeout(clearPeek, 1200);
    }

    scene.addEventListener('pointerdown', event => {
      if (!isTouch(event)) return;
      touching = true;
      clearTimeout(releaseTimer);
      svg.classList.add('hotspot-peek');
      mark(event.target);
    }, { passive: true });

    scene.addEventListener('pointermove', event => {
      if (!isTouch(event)) return;
      if (touching) {
        mark(document.elementFromPoint(event.clientX, event.clientY));
      } else if (event.pointerType === 'pen') {
        // iPads with Apple Pencil hover also show the currently hovered area.
        mark(document.elementFromPoint(event.clientX, event.clientY));
      }
    }, { passive: true });

    scene.addEventListener('pointerleave', event => {
      if (event.pointerType === 'pen' && !touching) mark(null);
    });
    window.addEventListener('pointerup', release, { passive: true });
    window.addEventListener('pointercancel', release, { passive: true });
    window.addEventListener('blur', () => {
      touching = false;
      clearTimeout(releaseTimer);
      clearPeek();
    });

    guide.addEventListener('click', () => {
      const enabled = guide.getAttribute('aria-pressed') !== 'true';
      guide.setAttribute('aria-pressed', String(enabled));
      guide.setAttribute('aria-label', enabled
        ? 'Masquer les contours des éléments cliquables'
        : 'Afficher les contours des éléments cliquables');
      guide.textContent = enabled ? '✓ Masquer les zones' : '✧ Voir les zones';
      svg.classList.toggle('hotspot-guide-on', enabled);
      if (!enabled) {
        svg.classList.remove('hotspot-peek');
        mark(null);
      }
    });
  })();
  </script>

<script>
(function(){
 const bar=document.getElementById('menubar'),toggle=document.getElementById('mobile-menu-toggle'),panel=document.getElementById('mobile-menu-panel');
 if(!bar||!toggle||!panel)return;
 const ids=['menu-about','menu-contact','menu-help','nana-admin-trigger','language-toggle','theme-toggle','switch-mode'];
 const originals=ids.map(id=>document.getElementById(id)).filter(Boolean);
 const slots=originals.map(el=>({el,parent:el.parentNode,next:el.nextSibling}));
 const mq=window.matchMedia('(max-width:760px)');
 function close(){bar.classList.remove('mobile-menu-open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Ouvrir le menu');}
 function sync(){close();if(mq.matches){originals.forEach(el=>panel.appendChild(el));}else{slots.forEach(({el,parent,next})=>{if(next&&next.parentNode===parent)parent.insertBefore(el,next);else parent.appendChild(el);});}}
 toggle.addEventListener('click',()=>{const open=bar.classList.toggle('mobile-menu-open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Fermer le menu':'Ouvrir le menu');});
 panel.addEventListener('click',e=>{if(e.target.closest('button'))close();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
 document.addEventListener('pointerdown',e=>{if(!bar.contains(e.target))close();});
 mq.addEventListener?.('change',sync);sync();
})();
</script>

<script id="nana-minilab-day-layer">
(() => {
  const mount = () => {
    const scene = document.getElementById('play-scene');
    if (!scene || scene.querySelector('.nana-minilab-day')) return;
    const image = document.createElement('img');
    image.className = 'nana-minilab-day';
    image.src = 'assets/IMG_5018.png';
    image.alt = '';
    image.setAttribute('aria-hidden', 'true');
    image.decoding = 'async';
    image.onerror = () => image.remove();
    scene.appendChild(image);
    const nightImage = document.createElement('img');
    nightImage.className = 'nana-minilab-night';
    nightImage.src = 'assets/IMG_5022.png';
    nightImage.alt = '';
    nightImage.setAttribute('aria-hidden', 'true');
    nightImage.decoding = 'async';
    nightImage.onerror = () => nightImage.remove();
    scene.appendChild(nightImage);

    // Hit-test the actual transparent PNG pixels, not the entire scene canvas.
    const alphaMaps = new WeakMap();
    for (const layer of [image, nightImage]) {
      layer.addEventListener('load', () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = layer.naturalWidth;
          canvas.height = layer.naturalHeight;
          const context = canvas.getContext('2d', {willReadFrequently:true});
          context.drawImage(layer, 0, 0);
          alphaMaps.set(layer, context);
        } catch (_) {}
      });
    }
    const activeLayer = () => document.documentElement.dataset.theme === 'night' ? nightImage : image;
    const hit = (event) => {
      const layer = activeLayer();
      const context = alphaMaps.get(layer);
      if (!context || !layer.naturalWidth || !layer.naturalHeight) return false;
      const rect = scene.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) / rect.width * layer.naturalWidth);
      const y = Math.floor((event.clientY - rect.top) / rect.height * layer.naturalHeight);
      if (x < 0 || y < 0 || x >= layer.naturalWidth || y >= layer.naturalHeight) return false;
      return context.getImageData(x, y, 1, 1).data[3] > 24;
    };
    scene.addEventListener('pointermove', event => {
      const hovered = hit(event);
      image.classList.toggle('is-hovered', hovered && activeLayer() === image);
      nightImage.classList.toggle('is-hovered', hovered && activeLayer() === nightImage);
      if (hovered) scene.style.cursor = 'pointer';
      else scene.style.removeProperty('cursor');
    });
    scene.addEventListener('pointerleave', () => {
      image.classList.remove('is-hovered');
      nightImage.classList.remove('is-hovered');
      scene.style.removeProperty('cursor');
    });
    scene.addEventListener('click', event => {
      if (!hit(event)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      if (window.NanaDreamLab && typeof window.NanaDreamLab.open === 'function') {
        window.NanaDreamLab.open();
      }
    }, true);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
  else mount();
})();
</script>
