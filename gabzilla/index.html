<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GABZILLA</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7fc;color:#49345b;font:14px 'Courier New',monospace}.app{padding:12px}.heading{text-align:center;color:#c82f76;font-weight:bold;letter-spacing:1px;margin:3px 0 12px}.stage{height:min(48vh,465px);min-height:245px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#fff0f9);border:2px inset #f5c6e2;padding:8px}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.nav button{background:#ffe2f3;color:#593775;border:2px outset #fff;cursor:pointer;padding:9px 12px;font:inherit}.nav button:active{border-style:inset}.caption{text-align:center;flex:1;font-size:13px}.thumbs{display:flex;justify-content:center;gap:9px}.thumbs button{padding:3px;border:2px solid #e5b3d9;background:white;cursor:pointer}.thumbs button[aria-pressed=true]{border-color:#7d5bc8;background:#e4d8ff}.thumbs img{width:60px;height:55px;object-fit:contain;display:block}small{display:block;text-align:center;color:#846e91;margin-top:8px} @media(max-width:480px){.stage{height:42vh;min-height:230px}.thumbs img{width:53px;height:49px}}
</style><div class="app"><div class="heading">✿ GABZILLA · COLLABORATION ✿</div><div class="stage"><img id="art" src="illustration.jpeg" alt="Illustration originale GABZILLA"></div><div class="nav"><button id="prev" aria-label="Image précédente">◀</button><span class="caption" id="caption">1 / 3 · Illustration originale</span><button id="next" aria-label="Image suivante">▶</button></div><div class="thumbs" id="thumbs"></div><small>Illustration · Design textile · T-shirt porté</small></div><script>
const slides=[['illustration.jpeg','Illustration originale'],['composition.jpeg','Composition du t-shirt'],['tshirt-porte.jpeg','T-shirt porté · face et dos']];let index=0;const art=document.getElementById('art'),caption=document.getElementById('caption'),thumbs=document.getElementById('thumbs');slides.forEach(([src,label],i)=>{const b=document.createElement('button');b.setAttribute('aria-label',label);b.innerHTML='<img src="'+src+'" alt="">';b.onclick=()=>show(i);thumbs.appendChild(b)});function show(i){index=(i+slides.length)%slides.length;art.src=slides[index][0];art.alt=slides[index][1];caption.textContent=(index+1)+' / '+slides.length+' · '+slides[index][1];[...thumbs.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===index?'true':'false'))}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);show(0);
</script></html>
